# Builds with Vite and publishes dist/ to GitHub Pages.
# Needs Settings → Pages → Source: "GitHub Actions". Until that is switched, Pages
# keeps serving the repo as-is (which still works, unbuilt), so this only runs by hand.
# Once switched, add `push: { branches: [main] }` under `on:`.
name: Deploy to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
